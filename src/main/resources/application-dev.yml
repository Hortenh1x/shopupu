# Local development only. Never use these values outside a developer machine.
app:
  cors:
    # Dev frontends run on localhost. Hardcoded (not ${CORS_ALLOWED_ORIGINS:...})
    # on purpose: a production-shaped .env sets CORS_ALLOWED_ORIGINS=https://shop.example.com,
    # and a placeholder here would resolve to that and lock the local SPA out. The
    # dev profile always trusts localhost; prod (no dev profile) still reads the env.
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000

spring:
  datasource:
    username: ${DB_USERNAME:postgres}
  jpa:
    show-sql: false
  flyway:
    enabled: true

jwt:
  # Dev-only signing key; production must set JWT_SECRET via environment.
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdefdjwqaidd289yhd22d8h32dsa}

logging:
  level:
    org.hibernate.SQL: INFO
    com.example.shopupu: DEBUG

# External AI is opt-in in every profile. When enabled, local Ollama can provide embeddings.
# Needs: ollama serve + `ollama pull bge-m3`.
ai:
  enabled: ${AI_ENABLED:false}
  embedding-provider: ${AI_EMBEDDING_PROVIDER:ollama}
  embedding-base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
