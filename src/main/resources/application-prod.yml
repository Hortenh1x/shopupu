# Production profile: everything sensitive must come from the environment.
spring:
  jpa:
    show-sql: false
  flyway:
    # A separate migration process owns DDL credentials. Runtime only validates schema.
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false

server:
  # Forwarding headers are untrusted by default, including in production.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  # structured JSON logs for log aggregation (OBS-01)
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.example.shopupu: INFO
    org.hibernate.SQL: WARN
