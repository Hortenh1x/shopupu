services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: shopupu
      POSTGRES_USER: shopupu
      POSTGRES_PASSWORD: shopupu
    ports:
      - "5432:5432"
    volumes:
      - shopupu-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopupu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shopupu-db:
