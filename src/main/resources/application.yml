spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: shopupu

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopupu}
    username: ${DB_USERNAME:shopupu}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${SMTP_AUTH:true}
        starttls.enable: ${SMTP_STARTTLS:true}
        starttls.required: ${SMTP_STARTTLS:true}
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Enable forwarding only after the edge strips client-supplied headers and
  # the origin is isolated; framework does not authenticate the proxy chain.
  # Default "none" = trust nothing (safe when exposed directly).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN
  health:
    mail:
      # Boot registers the SMTP probe whenever spring.mail.host is present, even empty, and a
      # failed probe turns the whole /actuator/health DOWN. With notifications.provider=disabled
      # (the default) that is noise; opt in once SMTP is the selected, verified sender.
      enabled: ${MAIL_HEALTH_ENABLED:false}

# Sign in with Google (AUTH-13). Blank client id => the feature stays off and the
# frontend hides the button; the OAuth Client ID is the same value used by the SPA.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

notifications:
  provider: ${NOTIFICATION_PROVIDER:disabled}
  from: ${SMTP_FROM:}
  max-attempts: 3
  # Sender selection is explicit. Credentials alone never enable delivery.
  # Owner must configure and verify SMTP/Resend before selecting its provider.
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${NOTIFICATIONS_FROM_EMAIL:}
    timeout-seconds: ${RESEND_TIMEOUT_SECONDS:10}

jwt:
  # No default on purpose: the application must fail to start without a real secret.
  # Dev profile supplies a local-only value in application-dev.yml.
  secret: ${JWT_SECRET:}
  access-token-ttl-min: ${JWT_ACCESS_TTL_MIN:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  issuer: ${JWT_ISSUER:shopupu}
  audience: ${JWT_AUDIENCE:shopupu-api}

auth:
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:}
    issuer: ${MFA_ISSUER:Shopupu Demo}

logging:
  level:
    org.hibernate.SQL: INFO

payments:
  default-provider: ${PAYMENTS_DEFAULT_PROVIDER:stub}
  currency: ${PAYMENT_CURRENCY:EUR}
  service-base-url: ${PAYMENT_SERVICE_BASE_URL:}
  service-client-id: ${PAYMENT_SERVICE_CLIENT_ID:shopupu}
  service-secret: ${PAYMENT_SERVICE_SECRET:}
  callback-secret: ${PAYMENT_CALLBACK_SECRET:}
  callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
  request-timeout-seconds: ${PAYMENT_REQUEST_TIMEOUT_SECONDS:10}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  monobank:
    api-base-url: ${MONOBANK_API_BASE_URL:https://api.monobank.ua}
    token: ${MONOBANK_TOKEN:}
  fondy:
    api-base-url: ${FONDY_API_BASE_URL:https://pay.fondy.eu/api}
    merchant-id: ${FONDY_MERCHANT_ID:}
    secret: ${FONDY_SECRET:}

app:
  # Public base URL of the browser SPA; used to build reset/verify email links.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    public-base-url: ${PUBLIC_UPLOADS_BASE_URL:http://localhost:8080/uploads}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  checkout:
    pending-payment-ttl-min: ${CHECKOUT_PENDING_TTL_MIN:30}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-capacity: 10
    auth-refill-per-minute: 10
    checkout-capacity: 30
    checkout-refill-per-minute: 30
    semantic-capacity: 30
    semantic-refill-per-minute: 30

shipping:
  currency: ${SHIPPING_CURRENCY:EUR}
  free-shipping-threshold: ${FREE_SHIPPING_THRESHOLD:100.00}
  rates:
    dhl: 9.99
    standardPost: 4.99
    localPickup: 0.00
    defaultRate: 7.49

ai:
  enabled: ${AI_ENABLED:false}
  max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:2}
  external-calls-per-minute: ${AI_EXTERNAL_CALLS_PER_MINUTE:30}
  external-calls-per-day: ${AI_EXTERNAL_CALLS_PER_DAY:500}
  external-tokens-per-minute: ${AI_EXTERNAL_TOKENS_PER_MINUTE:60000}
  external-tokens-per-day: ${AI_EXTERNAL_TOKENS_PER_DAY:500000}
  max-input-bytes: ${AI_MAX_INPUT_BYTES:24000}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:800}
  max-response-bytes: ${AI_MAX_RESPONSE_BYTES:262144}
  requests-per-minute: ${AI_REQUESTS_PER_MINUTE:20}
  requests-per-day: ${AI_REQUESTS_PER_DAY:200}
  max-tracked-clients: ${AI_MAX_TRACKED_CLIENTS:10000}
  query-cache-entries: ${AI_QUERY_CACHE_ENTRIES:256}
  query-cache-minutes: ${AI_QUERY_CACHE_MINUTES:10}
  # embeddings: stub | ollama (local, :11434) | local (TEI) | voyage
  embedding-provider: ${AI_EMBEDDING_PROVIDER:ollama}
  embedding-model: ${AI_EMBEDDING_MODEL:bge-m3}
  embedding-base-url: ${AI_EMBEDDING_BASE_URL:}
  embedding-dim: ${AI_EMBEDDING_DIM:1024}
  # llm: stub | deepseek (OpenAI-compatible; deepseek-v4-flash, thinking disabled)
  llm-provider: ${AI_LLM_PROVIDER:stub}
  llm-model: ${AI_LLM_MODEL:deepseek-v4-flash}
  llm-base-url: ${AI_LLM_BASE_URL:}
  llm-api-key: ${DEEPSEEK_API_KEY:}
  voyage-api-key: ${VOYAGE_API_KEY:}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:15}
  review-summary-min-reviews: ${AI_REVIEW_SUMMARY_MIN_REVIEWS:3}
  stylist-match-max-distance: ${AI_STYLIST_MATCH_MAX_DISTANCE:0.45}
  # NL search relevance: candidates within MARGIN of the best hit are shown; if even
  # the best hit is beyond MAX_DISTANCE the catalog cannot answer the query at all
  nl-search-max-distance: ${AI_NL_SEARCH_MAX_DISTANCE:0.62}
  nl-search-distance-margin: ${AI_NL_SEARCH_DISTANCE_MARGIN:0.05}
  nl-search-candidates: ${AI_NL_SEARCH_CANDIDATES:60}

springdoc:
  # Deterministic /v3/api-docs: springdoc otherwise emits Page schema properties (first/last/...) in
  # reflection order, which flips between JVM runs and makes the committed api.d.ts comparison flap.
  writer-with-order-by-keys: true
