name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = tests (unit + Testcontainers integration) + JaCoCo threshold + Spotless
      - name: Build and verify
        run: ./mvnw -B verify

      - name: Build the release image with the tested revision
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t shopupu:ci .

      - name: Verify runtime JDK and revision label
        run: |
          docker run --rm --entrypoint java shopupu:ci -version
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' shopupu:ci)" = "$GITHUB_SHA"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # feeds the dependency graph so Dependabot alerts cover Maven deps (SEC-13)
      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
